name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bật và cấu hình Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Đóng gói toàn bộ repo
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Triển khai
        id: deployment
        uses: actions/deploy-pages@v4
